# EXECUTED is intentional here: this watch set is meant for the lowest-latency local quoting path.
publish_executed = true
socket = "/run/reth-statefeed/statefeed.sock"
socket_mode = 0o660
queue_capacity = 8192
candidate_cache_blocks = 128
candidate_metadata_entries = 1024
candidate_retention = "2m"
retirement_work_budget = 256
consumer_buffer = 256
max_consumers = 64
max_frame_bytes = 65536
publisher_spin_us = 0

