[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["dependencies"]
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 10_000
fuzz = { runs = 256 }
fs_permissions = [
    { access = "read", path = "../config.ethereum-mainnet-conversions.toml" },
    { access = "read", path = "./historical-cases.toml" },
    { access = "read-write", path = "./fixtures" },
]

[dependencies]
forge-std = "1.9.7"
"@openzeppelin-contracts" = "5.4.0"

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
